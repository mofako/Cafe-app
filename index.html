<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .calculator {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .menu-header,
    .menu-item {
      display: grid;
      grid-template-columns: 1fr 100px 80px;
      gap: 10px;
      align-items: center;
    }

    .menu-header {
      font-weight: bold;
      padding-bottom: 10px;
      border-bottom: 2px solid #ddd;
    }

    .menu-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .price {
      text-align: right;
    }

    input[type="number"] {
      width: 60px;
      padding: 6px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #total {
      margin-top: 20px;
      text-align: right;
      font-size: 22px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .error {
      color: #c62828 !important;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h1>Café Bill Calculator</h1>

    <div class="menu-header">
      <span>Item</span>
      <span class="price">Price</span>
      <span>Qty</span>
    </div>

    <div id="menu">
      <div id="message">Loading menu...</div>
    </div>

    <button id="calculateButton" type="button">
      Calculate Bill
    </button>

    <div id="total">
      Total: $0.00
    </div>
  </div>

  <script>
    let menuItems = [];

    async function loadMenu() {
      const menuContainer = document.getElementById("menu");
      const calculateButton = document.getElementById("calculateButton");

      calculateButton.disabled = true;

      try {
        const response = await fetch("menu.csv");

        if (!response.ok) {
          throw new Error("Unable to load menu.csv");
        }

        const csvText = await response.text();

        menuItems = parseCSV(csvText);

        if (menuItems.length === 0) {
          throw new Error("No menu items found.");
        }

        displayMenu();

        calculateButton.disabled = false;

      } catch (error) {
        menuContainer.innerHTML =
          '<div id="message" class="error">' +
          'Unable to load the menu.' +
          '</div>';

        console.error(error);
      }
    }

    function parseCSV(csvText) {
      const lines = csvText
        .trim()
        .split(/\r?\n/);

      const items = [];

      // Skip the first row because it contains the column headings.
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();

        if (!line) {
          continue;
        }

        const columns = line.split(",");

        if (columns.length < 2) {
          continue;
        }

        const name = columns[0].trim();
        const price = parseFloat(columns[1].trim());

        if (name && !isNaN(price)) {
          items.push({
            name: name,
            price: price
          });
        }
      }

      return items;
    }

    function displayMenu() {
      const menuContainer = document.getElementById("menu");

      menuContainer.innerHTML = "";

      menuItems.forEach((item, index) => {
        const row = document.createElement("div");

        row.className = "menu-item";

        const itemName = document.createElement("span");
        itemName.textContent = item.name;

        const itemPrice = document.createElement("span");
        itemPrice.className = "price";
        itemPrice.textContent = "$" + item.price.toFixed(2);

        const quantity = document.createElement("input");
        quantity.type = "number";
        quantity.min = "0";
        quantity.step = "1";
        quantity.value = "0";
        quantity.id = "qty-" + index;
        quantity.setAttribute(
          "aria-label",
          "Quantity for " + item.name
        );

        row.appendChild(itemName);
        row.appendChild(itemPrice);
        row.appendChild(quantity);

        menuContainer.appendChild(row);
      });
    }

    function calculateBill() {
      let total = 0;

      menuItems.forEach((item, index) => {
        const quantityInput =
          document.getElementById("qty-" + index);

        let quantity = parseInt(quantityInput.value, 10);

        if (isNaN(quantity) || quantity < 0) {
          quantity = 0;
          quantityInput.value = 0;
        }

        total += item.price * quantity;
      });

      document.getElementById("total").textContent =
        "Total: $" + total.toFixed(2);
    }

    document
      .getElementById("calculateButton")
      .addEventListener("click", calculateBill);

    loadMenu();
  </script>

</body>
</html>
